name: Despliegue Automático en IONOS 🚀

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: 🚀 Build y Despliegue por FTP
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Obtener el código
      uses: actions/checkout@v4

    - name: 📦 Instalar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 🔨 Instalar y Compilar (Build)
      run: |
        npm ci || npm install
        npm run build

    - name: 📂 Sincronizar a IONOS por SFTP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SFTP_SERVER }}
        username: ${{ secrets.SFTP_USERNAME }}
        password: ${{ secrets.SFTP_PASSWORD }}
        port: 22
        source: "dist/"
        target: "/taskmanager"
        strip_components: 1
